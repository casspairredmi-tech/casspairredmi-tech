<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0b5fff" />
  <title>Demo PWA – Cours & Quiz</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <div>
        <div class="title">Demo PWA – Cours & Quiz</div>
        <div class="sub">GitHub Pages • Offline</div>
      </div>
    </div>
    <button id="btnInstall" class="btn ghost" hidden>Installer</button>
  </header>

  <main class="layout">
    <aside class="panel">
      <h2>Chapitres</h2>
      <div id="chapters" class="list"></div>

      <h2 style="margin-top:16px;">Mode</h2>
      <div class="seg">
        <button id="modeCourse" class="btn segbtn active">Cours</button>
        <button id="modeQuiz" class="btn segbtn">Exercices</button>
      </div>

      <div class="footer">
        <small id="status">Chargement…</small>
      </div>
    </aside>

    <section class="content">
      <div id="viewCourse" class="card"></div>
      <div id="viewQuiz" class="card" hidden></div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
