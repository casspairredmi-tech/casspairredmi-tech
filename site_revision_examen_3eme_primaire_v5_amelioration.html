<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Révision Examen – 3ème Primaire (v5)</title>
<style>
:root{
  --bg:#f6f7fb; --card:#ffffff; --text:#111; --muted:#444;
  --border:#dfe3ee; --accent:#0b57d0; --accent2:#111;
  --ok:#0b6b2a; --bad:#b00020; --warn:#8a6d00;
  --shadow: 0 10px 30px rgba(0,0,0,.08);
  --radius: 18px;
}
[data-theme="dark"]{
  --bg:#0f1117; --card:#171a22; --text:#f3f4f6; --muted:#b6bbc7;
  --border:#2a2f3b; --accent:#67b7ff; --accent2:#e5e7eb;
  --shadow: 0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial;
  background:var(--bg); color:var(--text);
}
a{color:var(--accent); text-decoration:none}
a:hover{text-decoration:underline}
.container{display:flex; min-height:100vh;}
/* Topbar */
.topbar{
  position:sticky; top:0; z-index:30;
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 12px; background:var(--card); border-bottom:1px solid var(--border);
}
.brand{display:flex; gap:10px; align-items:center}
.brand h1{font-size:16px; margin:0; line-height:1.1}
.brand .sub{font-size:12px; color:var(--muted)}
.iconBtn{
  border:1px solid var(--border); background:var(--card); color:var(--text);
  border-radius:12px; padding:8px 10px; font-weight:800; cursor:pointer;
}
.iconBtn:active{transform:scale(.98)}
.controls{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.pill{
  border:1px solid var(--border); background:var(--card); color:var(--text);
  border-radius:999px; padding:8px 10px; font-weight:800; cursor:pointer;
}
.pill.active{border-color:var(--accent); box-shadow: 0 0 0 3px rgba(103,183,255,.18)}
select, input[type="text"], input[type="number"], textarea{
  width:100%; padding:10px 12px; border:1px solid var(--border);
  border-radius:12px; background:var(--card); color:var(--text);
  font-weight:700;
}
textarea{min-height:90px; resize:vertical}
small,.muted{color:var(--muted)}

/* Sidebar */
.sidebar{
  width:320px; max-width:85vw;
  background:var(--card); border-right:1px solid var(--border);
  padding:12px;
  position:fixed; inset:0 auto 0 0; transform:translateX(-110%);
  transition:transform .25s ease; z-index:50; overflow:auto;
}
.sidebar.open{transform:translateX(0)}
.sideTop{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.sideTop h2{margin:0; font-size:16px}
.navGroup{margin:12px 0 0}
.navTitle{font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:14px 0 8px}
.navbtn{
  width:100%; text-align:left; padding:10px 10px; border:1px solid var(--border);
  border-radius:14px; background:var(--card); color:var(--text);
  margin:6px 0; cursor:pointer; font-weight:900;
}
.navbtn.active{border-color:var(--accent); box-shadow:0 0 0 3px rgba(103,183,255,.18)}
.badge{float:right; font-size:12px; padding:2px 8px; border-radius:999px; border:1px solid var(--border); color:var(--muted)}
hr{border:none; border-top:1px solid var(--border); margin:12px 0}

/* Main */
.main{flex:1; margin-left:0; width:100%;}
.pageWrap{max-width:980px; margin:0 auto; padding:14px 12px 80px;}
.card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px; margin:12px 0;}
.card h2{margin:0 0 10px; font-size:20px}
.card h3{margin:12px 0 8px; font-size:16px}
.row{display:grid; grid-template-columns: 1fr 1fr; gap:10px}
@media (max-width: 820px){ .row{grid-template-columns:1fr} }
.kpis{display:grid; grid-template-columns: repeat(3,1fr); gap:10px}
@media (max-width: 820px){ .kpis{grid-template-columns:1fr} }
.kpi{padding:10px; border:1px dashed var(--border); border-radius:16px; background:rgba(0,0,0,.02)}
[data-theme="dark"] .kpi{background:rgba(255,255,255,.03)}
.kpi b{font-size:18px}
.progress{height:10px; border-radius:999px; background:rgba(0,0,0,.08); overflow:hidden; border:1px solid var(--border)}
.progress > div{height:100%; width:0%; background:var(--accent)}

/* Theme cards */
.themeHeader{display:flex; gap:10px; align-items:flex-start; justify-content:space-between}
.themeHeader .left{flex:1}
.themeHeader .right{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.tag{font-size:12px; padding:3px 10px; border:1px solid var(--border); border-radius:999px; color:var(--muted)}
.btn{
  border:1px solid var(--border); background:var(--card); color:var(--text);
  border-radius:14px; padding:10px 12px; cursor:pointer; font-weight:900;
}
.btn.primary{background:var(--accent); border-color:var(--accent); color:white}
.btn.ok{border-color:rgba(11,107,42,.35)}
.btn.bad{border-color:rgba(176,0,32,.35)}
.btn:active{transform:scale(.985)}
.collapsible{border:1px solid var(--border); border-radius:16px; overflow:hidden; margin-top:10px}
.collapsible summary{list-style:none; cursor:pointer; padding:10px 12px; font-weight:900; display:flex; align-items:center; justify-content:space-between; gap:10px}
.collapsible summary::-webkit-details-marker{display:none}
.collapsible .content{padding:10px 12px; border-top:1px solid var(--border)}
.list{margin:0; padding-left:20px}
.notice{padding:10px 12px; border-radius:14px; border:1px solid var(--border); background:rgba(0,0,0,.02)}
[data-theme="dark"] .notice{background:rgba(255,255,255,.03)}
.good{color:var(--ok); font-weight:900}
.bad{color:var(--bad); font-weight:900}
.warn{color:var(--warn); font-weight:900}
.answer{display:none; margin-top:8px; padding:10px 12px; border-radius:14px; border:1px dashed var(--border); color:var(--muted)}
.answer.show{display:block}
.exerciseItem{margin:10px 0; padding:10px; border:1px solid var(--border); border-radius:16px}
.exerciseItem .top{display:flex; gap:10px; align-items:flex-start; justify-content:space-between}
.exerciseItem .top b{display:block}
.exerciseItem .grid{display:grid; grid-template-columns: 1fr auto; gap:8px; align-items:center}
@media(max-width:820px){ .exerciseItem .grid{grid-template-columns:1fr} }
.opt{display:flex; gap:8px; align-items:center; margin:6px 0}
.opt input{accent-color:var(--accent)}

.photoRow{display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:8px}
@media(max-width:820px){ .photoRow{grid-template-columns:1fr} }
.figure{border:1px solid var(--border); border-radius:16px; overflow:hidden; background:var(--card)}
.figure img{display:block; width:100%; height:180px; object-fit:cover; background:#eee}
.figure .cap{padding:8px 10px; font-size:12px; color:var(--muted)}
body[data-img="none"] .figure{display:none !important}
body[data-img="svg"] .figure img{display:none !important}
body[data-img="svg"] .figure .cap::before{content:"Dessin: "; font-weight:900}
body[data-img="photos"] .figure .cap::before{content:"Photo: "; font-weight:900}
svg.emoji{width:100%; height:180px; display:none; background:linear-gradient(180deg, rgba(0,0,0,.02), transparent)}
body[data-img="svg"] svg.emoji{display:block}
/* Arabic */
.arPage{direction:rtl; text-align:right; font-family:"Noto Naskh Arabic","Amiri","Scheherazade New",serif; font-size:18px; line-height:1.9}
.arPage h2,.arPage h3{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial; direction:ltr; text-align:left}
.arPage .tag{direction:ltr}
.arPage .opt{justify-content:flex-end}
.arPage select,.arPage input,.arPage textarea{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial; direction:rtl}
/* Exam */
.examBox{display:grid; gap:10px}
.examNav{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.qGrid{display:grid; grid-template-columns: repeat(10, 1fr); gap:6px}
@media(max-width:820px){ .qGrid{grid-template-columns: repeat(5, 1fr)} }
.qChip{padding:8px 0; text-align:center; border-radius:12px; border:1px solid var(--border); cursor:pointer; font-weight:900; background:var(--card)}
.qChip.done{border-color:rgba(103,183,255,.55)}
.qChip.bad{border-color:rgba(176,0,32,.5)}
.qChip.good{border-color:rgba(11,107,42,.5)}
.timer{font-variant-numeric: tabular-nums; font-weight:900}
/* Print */
@media print{
  .topbar,.sidebar,.noPrint{display:none !important}
  body{background:white}
  .card{box-shadow:none}
}
</style>

const $ = (q,root=document)=>root.querySelector(q);
const $$ = (q,root=document)=>Array.from(root.querySelectorAll(q));

const STORE_KEY = "rev_exam_3ap_v5";
function loadStore(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)||"{}"); }catch(e){ return {}; } }
function saveStore(obj){ localStorage.setItem(STORE_KEY, JSON.stringify(obj)); }
function norm(s){ return (s||"").toString().trim().toLowerCase().replace(/\s+/g," "); }

const UI = window.APP_DATA.ui;
function t(lang, key){ return (UI[lang] && UI[lang][key]) || (UI.fr[key]||key); }

function getSubject(key){ return window.APP_DATA.subjects.find(s=>s.key===key); }
function subjectBankKeys(subKey){
  const subj = getSubject(subKey);
  const keys = new Set();
  (subj?.themes||[]).forEach(th=>{ if(th.bankKey) keys.add(th.bankKey); });
  return Array.from(keys);
}

function buildNav(){
  const nav = $("#navMain");
  nav.innerHTML = "";
  const store = loadStore();
  const tracking = store.tracking || {};
  const totalLessons = window.APP_DATA.subjects.reduce((n,s)=>n+(s.themes?.length||0),0);
  const doneCount = Object.values(tracking).filter(v=>v==="Terminé").length;

  function navBtn(item){
    const b = document.createElement("button");
    b.className = "navbtn";
    b.dataset.nav = item.key;
    b.innerHTML = `${item.label} <span class="badge">${item.badge||""}</span>`;
    b.addEventListener("click", ()=>{ showPage(item.key); closeMenu(); });
    return b;
  }

  nav.appendChild(navBtn({key:"accueil", label:"🏁 Accueil"}));
  nav.appendChild(navBtn({key:"suivi", label:`✅ Suivi <span class="badge">${doneCount}/${totalLessons}</span>`, badge:""}));
  nav.appendChild(navBtn({key:"examen", label:"📝 Mode examen (/20)"}));

  const title = document.createElement("div");
  title.className = "navTitle";
  title.textContent = "Matières";
  nav.appendChild(title);

  window.APP_DATA.subjects.forEach(s=>{
    nav.appendChild(navBtn({key:s.key, label:s.title}));
  });
}

function openMenu(){ $("#sidebar").classList.add("open"); }
function closeMenu(){ $("#sidebar").classList.remove("open"); }

$("#menuBtn").addEventListener("click", openMenu);
$("#closeMenu").addEventListener("click", closeMenu);

$$("[data-imgmode]").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    $$("[data-imgmode]").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    document.body.dataset.img = btn.dataset.imgmode;
    const st = loadStore(); st.imgMode = btn.dataset.imgmode; saveStore(st);
  });
});

$("#darkBtn").addEventListener("click", ()=>{
  const cur = document.body.dataset.theme || "light";
  const nxt = cur==="light" ? "dark" : "light";
  document.body.dataset.theme = nxt;
  $("#darkBtn").textContent = nxt==="dark" ? "☀️" : "🌙";
  const st = loadStore(); st.theme = nxt; saveStore(st);
});

function initSettings(){
  const st = loadStore();
  const mode = st.imgMode || "photos";
  document.body.dataset.img = mode;
  $$("[data-imgmode]").forEach(b=>b.classList.toggle("active", b.dataset.imgmode===mode));
  const theme = st.theme || "light";
  document.body.dataset.theme = theme;
  $("#darkBtn").textContent = theme==="dark" ? "☀️" : "🌙";
}

function pageShell(id, title, extraClass=""){
  const sec = document.createElement("section");
  sec.className = `card page ${extraClass}`;
  sec.id = id;
  sec.dataset.page = id;
  sec.innerHTML = `<h2>${title}</h2><div data-body></div>`;
  return sec;
}

      const copy = allThemes.slice();
      const out=[];

        out.push(copy.splice(i,1)[0]);

    }
    const picked = pick(3);
    $("#todayPlan", sec).innerHTML = picked.map((p,i)=>`<div><b>${i+1})</b> ${p.subTitle} → <b>${p.theme}</b></div>`).join("");
    const st2 = loadStore(); st2.todayPlan = picked; saveStore(st2);
  }
  $("#regenPlan", sec).addEventListener("click", randomPlan);
  $("#goPlan", sec).addEventListener("click", ()=>{
    const st2 = loadStore();
    const plan = st2.todayPlan || [];
    if(!plan.length) return;
    showPage(plan[0].sub);
    setTimeout(()=>{
      const el = document.querySelector(`[data-theme-card][data-theme-title="${CSS.escape(plan[0].theme)}"]`);
      if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
    }, 60);
  });
  if((st.todayPlan||[]).length) {
    $("#todayPlan", sec).innerHTML = st.todayPlan.map((p,i)=>`<div><b>${i+1})</b> ${p.subTitle} → <b>${p.theme}</b></div>`).join("");
  } else {
    randomPlan();
  }
  return sec;
}

function getTracking(){
  const st = loadStore();
  return st.tracking || {};
}
function setTracking(tr){
  const st = loadStore();
  st.tracking = tr;
  saveStore(st);
  buildNav();
}

function renderTracking(){
  const sec = pageShell("suivi","Suivi des cours");
  const body = sec.querySelector("[data-body]");
  const tracking = getTracking();

  const lessons = [];
  window.APP_DATA.subjects.forEach(s=>{
    (s.themes||[]).forEach(th=>lessons.push({id:`${s.key}::${th.key}`, subject:s.title, theme:th.title, lang:th.lang}));
  });

  const total = lessons.length;
  const done = lessons.filter(l=>tracking[l.id]==="Terminé").length;
  const started = lessons.filter(l=>tracking[l.id]==="En cours" || tracking[l.id]==="Terminé").length;

  body.innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="muted">Cours commencés</div><b>${started} / ${total}</b></div>
      <div class="kpi"><div class="muted">Cours terminés</div><b>${done} / ${total}</b></div>
      <div class="kpi"><div class="muted">Progression</div><b>${Math.round((done/Math.max(1,total))*100)}%</b></div>
    </div>
    <div class="progress" style="margin-top:10px"><div style="width:${(done/Math.max(1,total))*100}%"></div></div>

    <div class="notice" style="margin-top:12px">
      <b>Statuts</b> : Non entamé / En cours / Terminé.
      <div class="muted">Conseil : passe à “Terminé” après avoir fait exercices + QCM.</div>
    </div>

    <div class="card" style="box-shadow:none">
      <div class="row">
        <div>
          <label>Filtrer par matière</label>
          <select id="filterSub">
            <option value="">Toutes</option>
            ${window.APP_DATA.subjects.map(s=>`<option value="${s.key}">${s.title}</option>`).join("")}
          </select>
        </div>
        <div>
          <label>Recherche</label>
          <input id="filterText" type="text" placeholder="Tape un mot…"/>
        </div>
      </div>
    </div>

    <div id="trackList"></div>
  `;

  function renderList(){
    const sub = $("#filterSub", sec).value;
    const q = norm($("#filterText", sec).value);
    const list = $("#trackList", sec);
    list.innerHTML = "";

    lessons
      .filter(l=>!sub || l.id.startsWith(sub+"::"))
      .filter(l=>!q || norm(l.theme).includes(q) || norm(l.subject).includes(q))
      .forEach((l)=> {
        const st = tracking[l.id] || "Non entamé";
        const item = document.createElement("div");
        item.className = "exerciseItem";
        item.innerHTML = `
          <div class="top">
            <div>
              <b>${l.subject}</b>
              <div class="muted">${l.theme}</div>
            </div>
            <div style="min-width:180px">
              <select data-id="${l.id}">
                <option ${st==="Non entamé"?"selected":""}>Non entamé</option>
                <option ${st==="En cours"?"selected":""}>En cours</option>
                <option ${st==="Terminé"?"selected":""}>Terminé</option>
              </select>
              <div style="margin-top:8px">
                <button class="btn" data-open="${l.id}">Ouvrir</button>
              </div>
            </div>
          </div>
        `;
        list.appendChild(item);
      });

    $$("select[data-id]", sec).forEach(sel=>{
      sel.addEventListener("change", ()=>{
        tracking[sel.dataset.id] = sel.value;
        setTracking(tracking);
      });
    });
    $$("button[data-open]", sec).forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const [subKey, themeKey] = btn.dataset.open.split("::");
        showPage(subKey);
        setTimeout(()=>{
          const card = document.querySelector(`[data-theme-card][data-theme-key="${CSS.escape(themeKey)}"]`);
          if(card) card.scrollIntoView({behavior:"smooth", block:"start"});
        }, 60);
      });
    });
  }

  $("#filterSub", sec).addEventListener("change", renderList);
  $("#filterText", sec).addEventListener("input", renderList);
  renderList();

  return sec;
}

function exerciseRenderer(theme, ex, idx){
  const lang = theme.lang;
  const box = document.createElement("div");
  box.className = "exerciseItem";

  function mkAnswer(html){
    const a = document.createElement("div");
    a.className = "answer";
    a.innerHTML = html;
    return a;
  }

  const top = document.createElement("div");
  top.className = "top";
  top.innerHTML = `<div><b>${ex.title || (t(lang,"exercises")+" "+(idx+1))}</b></div>
                   <div style="display:flex; gap:8px; flex-wrap:wrap">
                     <button class="btn" data-show>${t(lang,"show_answers")}</button>
                     <button class="btn" data-hide>${t(lang,"hide_answers")}</button>
                   </div>`;
  box.appendChild(top);

  const content = document.createElement("div");
  box.appendChild(content);

  const ans = mkAnswer("");
  box.appendChild(ans);

  function showAns(){ ans.classList.add("show"); }
  function hideAns(){ ans.classList.remove("show"); }
  $("[data-show]", top).addEventListener("click", showAns);
  $("[data-hide]", top).addEventListener("click", hideAns);

  if(ex.type === "fill"){
    const rows = ex.items.map((it,i)=>`
      <div class="grid" style="margin:8px 0">
        <div>
          <div class="muted">${it.hint||""}</div>
          <div><span>${it.text.replace("_____", "<span class='tag'>_____</span>")}</span></div>
          <input type="text" data-inp="${i}" placeholder="${lang==="ar"?"اكتب الجواب…":"Écris la réponse…"}"/>
        </div>
        <button class="btn primary" data-check="${i}">${t(lang,"check")}</button>
      </div>
      <div class="muted" data-msg="${i}"></div>
    `).join("");
    content.innerHTML = rows;
    ans.innerHTML = ex.items.map((it)=>`<div>✅ <b>${it.text.replace("_____", it.answer)}</b></div>`).join("");

    $$("[data-check]", content).forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const i = parseInt(btn.dataset.check,10);
        const inp = $(`[data-inp="${i}"]`, content);
        const msg = $(`[data-msg="${i}"]`, content);
        const ok = norm(inp.value) === norm(ex.items[i].answer);
        msg.innerHTML = ok ? `<span class="good">✅ OK</span>` : `<span class="bad">❌ Non</span> <span class="muted">→ ${ex.items[i].answer}</span>`;
      });
    });
  } else if(ex.type === "choose"){
    content.innerHTML = ex.items.map((it,i)=>{
      const name = `c_${theme.key}_${idx}_${i}`;
      const opts = it.opts.map((o,j)=>`
        <label class="opt"><input type="radio" name="${name}" value="${j}"/> <span>${o}</span></label>
      `).join("");
      return `<div style="margin:10px 0">
        <b>${it.q}</b>
        <div>${opts}</div>
        <button class="btn primary" data-cq="${i}">${t(lang,"check")}</button>
        <div class="muted" data-cm="${i}"></div>
      </div>`;
    }).join("");
    ans.innerHTML = ex.items.map((it)=>`<div>✅ <b>${it.opts[it.a]}</b> — <span class="muted">${it.q}</span></div>`).join("");
    $$("[data-cq]", content).forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const i = parseInt(btn.dataset.cq,10);
        const name = `c_${theme.key}_${idx}_${i}`;
        const chosen = document.querySelector(`input[name="${name}"]:checked`);
        const msg = $(`[data-cm="${i}"]`, content);
        if(!chosen){ msg.innerHTML = `<span class="warn">⚠️ ${lang==="ar"?"اختر جواباً":"Choisis une réponse"}</span>`; return; }
        const ok = parseInt(chosen.value,10) === ex.items[i].a;
        msg.innerHTML = ok ? `<span class="good">✅ OK</span>` : `<span class="bad">❌</span> <span class="muted">→ ${ex.items[i].opts[ex.items[i].a]}</span>`;
      });
    });
  } else if(ex.type === "calc"){
    content.innerHTML = ex.items.map((it,i)=>`
      <div class="grid" style="margin:8px 0">
        <div>
          <b>${it.q}</b>
          <input type="text" data-inp="${i}" placeholder="..."/>
          <div class="muted" data-msg="${i}"></div>
        </div>
        <button class="btn primary" data-check="${i}">${t(lang,"check")}</button>
      </div>
    `).join("");
    ans.innerHTML = ex.items.map((it)=>`<div>✅ <b>${it.q} ${it.a}</b> <span class="muted">${it.hint?("("+it.hint+")"):""}</span></div>`).join("");
    $$("[data-check]", content).forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const i = parseInt(btn.dataset.check,10);
        const inp = $(`[data-inp="${i}"]`, content);
        const msg = $(`[data-msg="${i}"]`, content);
        const ok = norm(inp.value) === norm(ex.items[i].a);
        msg.innerHTML = ok ? `<span class="good">✅ OK</span>` : `<span class="bad">❌</span> <span class="muted">→ ${ex.items[i].a}</span>`;
      });
    });
  } else if(ex.type === "sort"){
    content.innerHTML = `
      <div class="notice">${lang==="ar"?"اختر العمود المناسب لكل كلمة.":"Choisis la bonne colonne pour chaque mot."}</div>
      ${ex.items.map((it,i)=>`
        <div class="grid" style="margin:8px 0">
          <div><b>${it.text}</b></div>
          <select data-inp="${i}">
            ${ex.cols.map((c,ci)=>`<option value="${ci}">${c}</option>`).join("")}
          </select>
        </div>
      `).join("")}
      <button class="btn primary" data-checkall>${t(lang,"check")}</button>
      <div class="muted" data-msgall></div>
    `;
    ans.innerHTML = ex.items.map(it=>`<div>✅ <b>${it.text}</b> → ${ex.cols[it.col]}</div>`).join("");
    $("[data-checkall]", content).addEventListener("click", ()=>{
      let ok=0;
      ex.items.forEach((it,i)=>{
        const v = parseInt($(`[data-inp="${i}"]`, content).value,10);
        if(v===it.col) ok++;
      });
      $("[data-msgall]", content).innerHTML = (ok===ex.items.length)
        ? `<span class="good">✅ ${ok}/${ex.items.length}</span>`
        : `<span class="warn">⚠️ ${ok}/${ex.items.length}</span> <span class="muted">${lang==="ar"?"ثم اضغط إظهار الأجوبة للتصحيح.":"Puis affiche les réponses pour corriger."}</span>`;
    });
  } else if(ex.type === "match"){
    const right = ex.pairs.map(p=>p[1]);
    content.innerHTML = `
      <div class="notice">${lang==="ar"?"اربط الكلمة بمرادفها.":"Associe le mot à son synonyme."}</div>
      ${ex.pairs.map((p,i)=>`
        <div class="grid" style="margin:8px 0">
          <div><b>${p[0]}</b></div>
          <select data-inp="${i}">
            ${right.map(r=>`<option value="${r}">${r}</option>`).join("")}
          </select>
        </div>
      `).join("")}
      <button class="btn primary" data-checkall>${t(lang,"check")}</button>
      <div class="muted" data-msgall></div>
    `;
    ans.innerHTML = ex.pairs.map(p=>`<div>✅ <b>${p[0]}</b> ↔ ${p[1]}</div>`).join("");
    $("[data-checkall]", content).addEventListener("click", ()=>{
      let ok=0;
      ex.pairs.forEach((p,i)=>{ if($(`[data-inp="${i}"]`, content).value===p[1]) ok++; });
      $("[data-msgall]", content).innerHTML = ok===ex.pairs.length ? `<span class="good">✅ ${ok}/${ex.pairs.length}</span>` : `<span class="warn">⚠️ ${ok}/${ex.pairs.length}</span>`;
    });
  } else if(ex.type === "transform"){
    const fromLabel = (ex.labels && ex.labels.from) || (lang==="ar"?"الجملة":"Phrase");
    const toLabel = (ex.labels && ex.labels.to) || (lang==="ar"?"التحويل":"Transformation");
    content.innerHTML = ex.items.map((it,i)=>`
      <div style="margin:10px 0">
        <div class="muted">${fromLabel}</div>
        <b>${it.pos || it.neg}</b>
        <div class="muted" style="margin-top:6px">${toLabel}</div>
        <input type="text" data-inp="${i}" placeholder="..."/>
        <div style="margin-top:8px; display:flex; gap:8px; flex-wrap:wrap">
          <button class="btn primary" data-check="${i}">${t(lang,"check")}</button>
        </div>
        <div class="muted" data-msg="${i}"></div>
      </div>
    `).join("");
    ans.innerHTML = ex.items.map(it=>`<div>✅ <b>${it.neg || it.pos}</b></div>`).join("");
    $$("[data-check]", content).forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const i=parseInt(btn.dataset.check,10);
        const expected = ex.items[i].neg || ex.items[i].pos;
        const inp = $(`[data-inp="${i}"]`, content);
        const msg = $(`[data-msg="${i}"]`, content);
        const ok = norm(inp.value) === norm(expected);
        msg.innerHTML = ok ? `<span class="good">✅ OK</span>` : `<span class="bad">❌</span> <span class="muted">→ ${expected}</span>`;
      });
    });
  } else if(ex.type === "conj"){
    content.innerHTML = ex.items.map((it,i)=>{
      const rows = it.persons.map((p,pi)=>`
        <div class="grid" style="margin:6px 0">
          <div><b>${p}</b> ( ${it.verb} )</div>
          <input data-inp="${i}_${pi}" type="text" placeholder="..."/>
        </div>
      `).join("");
      return `<div class="notice" style="margin:10px 0"><b>${it.verb}</b></div>${rows}
              <button class="btn primary" data-check="${i}">${t(lang,"check")}</button>
              <div class="muted" data-msg="${i}"></div>`;
    }).join("");
    ans.innerHTML = ex.items.map(it=>`<div style="margin:8px 0"><b>${it.verb}</b> : ${it.answers.join(" • ")}</div>`).join("");
    $$("[data-check]", content).forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const i = parseInt(btn.dataset.check,10);
        const it = ex.items[i];
        let ok=0;
        it.answers.forEach((a,pi)=>{
          const v = norm($(`[data-inp="${i}_${pi}"]`, content).value);
          if(v===norm(a)) ok++;
        });
        $(`[data-msg="${i}"]`, content).innerHTML = ok===it.answers.length ? `<span class="good">✅ ${ok}/${it.answers.length}</span>` : `<span class="warn">⚠️ ${ok}/${it.answers.length}</span>`;
      });
    });
  } else if(ex.type === "plan"){
    content.innerHTML = (ex.fields||[]).map((f,i)=>`
      <div style="margin:10px 0">
        <label><b>${f.label}</b></label>
        <textarea data-inp="${i}" placeholder="${f.placeholder||""}"></textarea>
      </div>
    `).join("") + `<div class="muted">${lang==="ar"?"ثم اضغط إظهار الأجوبة لرؤية مثال.":"Puis affiche les réponses pour voir un exemple."}</div>`;
    ans.innerHTML = (ex.model||[]).map(line=>`<div>✅ ${line}</div>`).join("");
  } else if(ex.type === "order"){
    content.innerHTML = `
      <div class="notice">${lang==="ar"?"اختر الترتيب الصحيح (1 ثم 2…).":"Choisis l’ordre correct (1 puis 2…)."}
      </div>
      ${ex.items.map((it,i)=>`
        <div class="grid" style="margin:8px 0">
          <div><b>${it}</b></div>
          <select data-inp="${i}">
            ${ex.items.map((_,n)=>`<option value="${n}">${n+1}</option>`).join("")}
          </select>
        </div>
      `).join("")}
      <button class="btn primary" data-checkall>${t(lang,"check")}</button>
      <div class="muted" data-msgall></div>
    `;
    ans.innerHTML = ex.answer.map((it,idx)=>`<div>✅ ${idx+1}) ${it}</div>`).join("");
    $("[data-checkall]", content).addEventListener("click", ()=>{
      const chosen = ex.items.map((_,i)=>parseInt($(`[data-inp="${i}"]`, content).value,10));
      let ok=0;
      ex.items.forEach((item,i)=>{
        const rank = chosen[i];
        const correctRank = ex.answer.indexOf(item);
        if(rank===correctRank) ok++;
      });
      $("[data-msgall]", content).innerHTML = ok===ex.items.length ? `<span class="good">✅ ${ok}/${ex.items.length}</span>` : `<span class="warn">⚠️ ${ok}/${ex.items.length}</span>`;
    });
  } else if(ex.type === "recite"){
    const ay = ex.ayat || [];
    let shown = 0;
    content.innerHTML = `
      <div class="notice">
        <b>${ex.surah?.name||""}</b><br/>
        <span class="muted">${lang==="ar"?"اضغط لإظهار الآيات واحدة واحدة.":"Clique pour afficher les versets un par un."}</span>
      </div>
      <div class="examBox" style="margin-top:10px">
        <div class="notice arPage" id="ayatBox_${theme.key}_${idx}"></div>
        <div class="examNav">
          <button class="btn primary" id="nextAy_${theme.key}_${idx}">+ آية</button>
          <button class="btn" id="resetAy_${theme.key}_${idx}">إعادة</button>
          <span class="tag" id="statAy_${theme.key}_${idx}"></span>
        </div>
        <details class="collapsible">
          <summary>🎧 استماع (اختياري) <span class="tag">قد يحتاج إنترنت</span></summary>
          <div class="content">
            <audio controls preload="none" style="width:100%">
              <source src="${ex.surah?.audio_hi||""}" type="audio/mpeg"/>
            </audio>
            <div class="muted" style="margin-top:8px">
              إذا لم يعمل الصوت، جرّب الرابطين:
              <div><a target="_blank" rel="noopener" href="${ex.surah?.audio_hi||""}">جودة عالية</a></div>
              <div><a target="_blank" rel="noopener" href="${ex.surah?.audio_norm||""}">جودة عادية</a></div>
            </div>
          </div>
        </details>
      </div>
    `;
    const boxEl = $(`#ayatBox_${theme.key}_${idx}`, content);
    const statEl = $(`#statAy_${theme.key}_${idx}`, content);

    function renderAy(){
      boxEl.innerHTML = "";
      for(let i=0;i<shown;i++) {
        const p = document.createElement("p");
        p.textContent = ay[i];
        boxEl.appendChild(p);
      }
      const total = Math.max(0, ay.length-1);
      const shownNoB = Math.max(0, shown-1);
      statEl.textContent = `الآيات: ${shownNoB} / ${total}`;
      $(`#nextAy_${theme.key}_${idx}`, content).disabled = shown >= ay.length;
    }
    $(`#nextAy_${theme.key}_${idx}`, content).addEventListener("click", ()=>{ shown = Math.min(ay.length, shown+1); renderAy(); });
    $(`#resetAy_${theme.key}_${idx}`, content).addEventListener("click", ()=>{ shown = 0; renderAy(); });
    renderAy();
    ans.innerHTML = `<div class="muted">${lang==="ar"?"التصحيح: التلاوة والحفظ بالتكرار.":"Correction: lire et répéter."}</div>`;
  } else {
    content.innerHTML = `<div class="muted">Exercice غير متوفر / Non disponible</div>`;
    ans.innerHTML = "";
  }

  return box;
}

function renderThemeCard(subj, theme){
  const card = document.createElement("div");
  card.className = "card";
  card.dataset.themeCard = "1";
  card.dataset.themeKey = theme.key;
  card.dataset.themeTitle = theme.title;

  const lang = theme.lang;
  const trackingId = `${subj.key}::${theme.key}`;
  const tracking = getTracking();
  const st = tracking[trackingId] || "Non entamé";

  const header = document.createElement("div");
  header.className = "themeHeader";
  header.innerHTML = `
    <div class="left">
      <h3 style="margin:0">${theme.title}</h3>
      <div class="muted">${subj.title}</div>
    </div>
    <div class="right">
      <span class="tag">${lang==="ar"?"عربي":"Français"}</span>
      <select data-track style="width:auto; min-width:160px">
        <option ${st==="Non entamé"?"selected":""}>Non entamé</option>
        <option ${st==="En cours"?"selected":""}>En cours</option>
        <option ${st==="Terminé"?"selected":""}>Terminé</option>
      </select>
    </div>
  `;
  card.appendChild(header);

  $("[data-track]", header).addEventListener("change",(e)=>{
    const tr = getTracking();
    tr[trackingId] = e.target.value;
    setTracking(tr);
  });

  const sum = document.createElement("details");
  sum.className = "collapsible";
  sum.open = true;
  sum.innerHTML = `<summary>📌 ${t(lang,"resume")} <span class="tag">${theme.summary.length} points</span></summary>
                  <div class="content"><ul class="list">${theme.summary.map(s=>`<li>${s}</li>`).join("")}</ul></div>`;
  card.appendChild(sum);

  if((theme.images||[]).length){
    const img = document.createElement("details");
    img.className = "collapsible";
    img.innerHTML = `<summary>🖼️ Illustrations <span class="tag">animaux/objets</span></summary>
      <div class="content">
        <div class="photoRow">
          ${theme.images.map((im)=>`
            <div class="figure">
              <img loading="lazy" alt="${im.label}" src="${im.photo||""}" onerror="this.style.display='none'"/>
              <svg class="emoji" viewBox="0 0 600 240" aria-label="${im.label}">
                <rect x="0" y="0" width="600" height="240" rx="18" fill="rgba(0,0,0,.03)"></rect>
                <text x="50%" y="52%" dominant-baseline="middle" text-anchor="middle" font-size="90">${im.svg||"📌"}</text>
              </svg>
              <div class="cap">${im.label}</div>
            </div>
          `).join("")}
        </div>
        <div class="muted" style="margin-top:8px">Astuce : mets “Dessins” si tu n’as pas Internet.</div>
      </div>`;
    card.appendChild(img);
  }

  const exWrap = document.createElement("details");
  exWrap.className = "collapsible";
  exWrap.open = true;
  exWrap.innerHTML = `<summary>🧩 ${t(lang,"exercises")} <span class="tag">${theme.exercises.length}</span></summary><div class="content" data-ex></div>`;
  card.appendChild(exWrap);
  const exBody = $("[data-ex]", exWrap);
  theme.exercises.forEach((ex, i)=>{ exBody.appendChild(exerciseRenderer(theme, ex, i)); });

  if(theme.bankKey){
    const qcm = document.createElement("details");
    qcm.className = "collapsible";
    qcm.innerHTML = `<summary>🧠 ${t(lang,"qcm")} <span class="tag">au hasard</span></summary>
      <div class="content">
        <div class="row">
          <div>
            <label>${lang==="ar"?"عدد الأسئلة":"Nombre de questions"}</label>
            <select data-qN>
              <option value="5">5</option>
              <option value="10">10</option>
              <option value="15">15</option>
            </select>
          </div>
          <div>
            <label>&nbsp;</label>
            <div style="display:flex; gap:8px; flex-wrap:wrap">
              <button class="btn primary" data-new>${t(lang,"new_qcm")}</button>
              <button class="btn" data-check>${t(lang,"check")}</button>
            </div>
          </div>
        </div>
        <div class="muted" data-status style="margin-top:8px"></div>
        <div data-list style="margin-top:8px"></div>
      </div>`;
    card.appendChild(qcm);
    initQcmGenerator(qcm, theme.bankKey, lang);
  }

  const tips = document.createElement("details");
  tips.className = "collapsible";
  tips.innerHTML = `<summary>✨ ${t(lang,"tips")} <span class="tag">${theme.tips.length}</span></summary>
    <div class="content">
      <ul class="list">${theme.tips.map(x=>`<li>${x}</li>`).join("")}</ul>
    </div>`;
  card.appendChild(tips);

  return card;
}

function pickRandom(arr, n){
  const a = (arr||[]).slice();
  const out=[];
  while(out.length<n && a.length){
    out.push(a.splice(Math.floor(Math.random()*a.length),1)[0]);
  }
  while(out.length<n && (arr||[]).length){
    out.push(arr[Math.floor(Math.random()*arr.length)]);
  }
  return out;
}

function initQcmGenerator(detailsEl, bankKey, lang){
  const list = $("[data-list]", detailsEl);
  const status = $("[data-status]", detailsEl);
  const btnNew = $("[data-new]", detailsEl);
  const btnCheck = $("[data-check]", detailsEl);
  const selN = $("[data-qN]", detailsEl);

  let current = [];
  function render(){
    list.innerHTML = "";
    status.textContent = "";
    const n = parseInt(selN.value,10) || 5;
    current = pickRandom(window.APP_DATA.bank[bankKey]||[], n);

    if((window.APP_DATA.bank[bankKey]||[]).length < n){
      status.innerHTML = `<span class="warn">⚠️</span> ${lang==="ar"?"عدد الأسئلة المتاحة قليل، قد تتكرر بعض الأسئلة.":"Banque courte : quelques questions peuvent se répéter."}`;
    }

    current.forEach((it, i)=>{
      const q = document.createElement("div");
      q.className = "exerciseItem";
      const name = `g_${bankKey}_${Math.random().toString(16).slice(2)}_${i}`;
      q.innerHTML = `
        <b>${i+1}) ${it.q}</b>
        <div style="margin-top:6px">
          ${it.opts.map((o,j)=>`<label class="opt"><input type="radio" name="${name}" value="${j}"/> <span>${o}</span></label>`).join("")}
        </div>
        <div class="muted" data-msg style="margin-top:6px"></div>
        <div class="answer" data-exp></div>
      `;
      list.appendChild(q);
    });
  }

  function check(){
    let correct=0;
    $$(".exerciseItem", list).forEach((box, i)=>{
      const chosen = box.querySelector("input[type=radio]:checked");
      const msg = box.querySelector("[data-msg]");
      const exp = box.querySelector("[data-exp]");
      if(!chosen){
        msg.innerHTML = `<span class="warn">⚠️</span> ${lang==="ar"?"اختر جواباً":"Choisis une réponse"}`;
        return;
      }
      const ok = parseInt(chosen.value,10) === current[i].a;
      if(ok) correct++;
      msg.innerHTML = ok ? `<span class="good">✅ OK</span>` : `<span class="bad">❌</span> <span class="muted">→ ${current[i].opts[current[i].a]}</span>`;
      exp.classList.add("show");
      exp.innerHTML = current[i].exp ? `💡 ${current[i].exp}` : "";
    });
    status.innerHTML = `${t(lang,"score")} : <b>${correct}</b> / <b>${$$(".exerciseItem", list).length}</b>`;
  }

  btnNew.addEventListener("click", render);
  btnCheck.addEventListener("click", check);
  selN.addEventListener("change", render);
  render();
}

function renderExamPage(){
  const sec = pageShell("examen","Mode examen (/20)");
  const body = sec.querySelector("[data-body]");
  const st = loadStore();
  const history = st.examHistory || [];

  body.innerHTML = `
    <div class="notice">
      <b>Mode examen</b> : réponses <b>bloquées</b> jusqu’à la fin → note /20 → corrections à la demande.
      <div class="muted">Conseil : fais une seule fois, comme à l’école.</div>
    </div>

    <div class="card" style="box-shadow:none">
      <div class="row">
        <div>
          <label>Matière</label>
          <select id="examSub">
            ${window.APP_DATA.subjects.map(s=>`<option value="${s.key}">${s.title}</option>`).join("")}
          </select>
        </div>
        <div>
          <label>Durée (minutes)</label>
          <select id="examMin">
            <option value="0">Sans chrono</option>
            <option value="10">10</option>
            <option value="15">15</option>
            <option value="20" selected>20</option>
            <option value="25">25</option>
            <option value="30">30</option>
          </select>
        </div>
      </div>
      <div style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap">
        <button class="btn primary" id="startExam">Commencer (20 questions)</button>
        <button class="btn" id="resetExam">Réinitialiser</button>
      </div>
      <div class="muted" id="examWarn" style="margin-top:8px"></div>
    </div>

    <div class="card" style="box-shadow:none">
      <h3>Historique</h3>
      <div class="muted">${history.length ? "" : "Aucun examen enregistré pour l’instant."}</div>
      <div id="histList" style="margin-top:8px"></div>
    </div>

    <div id="examArea"></div>
  `;

  function renderHistory(){
    const list = $("#histList", sec);
    list.innerHTML = history.slice().reverse().slice(0,8).map(h=>`
      <div class="exerciseItem">
        <div class="top">
          <div><b>${h.subject}</b><div class="muted">${h.date}</div></div>
          <div class="tag">${h.score}/20</div>
        </div>
      </div>
    `).join("");
  }
  renderHistory();

  let examState = null;
  let timerId = null;
  function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }

  function start(){
    stopTimer();
    const subKey = $("#examSub", sec).value;
    const mins = parseInt($("#examMin", sec).value,10) || 0;

    const keys = subjectBankKeys(subKey);
    const pool = keys.flatMap(k => (window.APP_DATA.bank[k]||[]).map(q=>({...q, _k:k})));
    const warn = $("#examWarn", sec);

    if(pool.length < 20){
      warn.innerHTML = `<span class="warn">⚠️</span> Banque petite (${pool.length}). Des questions peuvent se répéter.`;
    } else {
      warn.textContent = "";
    }

    const questions = pickRandom(pool, 20);
    examState = {
      subKey,
      subject: getSubject(subKey).title,
      mins,
      questions,
      answers: Array(20).fill(null),
      finished:false,
      score:null,
      showCorrections:false
    };

    renderExam();
    if(mins>0) startTimer(mins*60);
  }

  function startTimer(seconds){
    let left = seconds;
    function tick(){
      left = Math.max(0, left-1);
      const m = Math.floor(left/60);
      const s = left%60;
      $("#timer", sec).textContent = `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
      if(left<=0){
        stopTimer();
        finish(true);
      }
    }
    $("#timer", sec).textContent = `${String(Math.floor(left/60)).padStart(2,"0")}:${String(left%60).padStart(2,"0")}`;
    timerId = setInterval(tick, 1000);
  }

  function goto(i){
    const card = document.querySelector(`[data-exam-q="${i}"]`);
    if(card) card.scrollIntoView({behavior:"smooth", block:"start"});
  }

  function finish(auto=false){
    if(!examState || examState.finished) return;
    examState.finished = true;
    let correct=0;
    examState.questions.forEach((q,i)=>{ if(examState.answers[i]===q.a) correct++; });
    examState.score = correct;
    stopTimer();
    renderExam();

    const st2 = loadStore();
    st2.examHistory = st2.examHistory || [];
    const date = new Date().toLocaleString();
    st2.examHistory.push({date, subject: examState.subject, score: correct});
    saveStore(st2);
    history.push({date, subject: examState.subject, score: correct});
    renderHistory();
  }

  function renderExam(){
    const area = $("#examArea", sec);
    if(!examState){ area.innerHTML=""; return; }
    const lang = getSubject(examState.subKey).lang || "fr";

    area.innerHTML = `
      <div class="card">
        <div class="themeHeader">
          <div class="left">
            <h3 style="margin:0">Examen : ${examState.subject}</h3>
            <div class="muted">20 questions • note /20</div>
          </div>
          <div class="right">
            <span class="tag">${examState.mins>0 ? "⏱️ Chrono : " : ""}<span id="timer" class="timer">${examState.mins>0 ? "00:00" : "Sans chrono"}</span></span>
            <button class="btn" id="jumpTop">⬆️ Haut</button>
          </div>
        </div>

        <div class="qGrid" style="margin-top:10px" id="qGrid"></div>

        <div class="examNav" style="margin-top:10px">
          <button class="btn primary" id="finishBtn">${examState.finished ? "Terminé" : "Corriger (Note /20)"}</button>
          <button class="btn" id="toggleCorr" ${!examState.finished ? "disabled" : ""}>${examState.showCorrections ? "Masquer corrections" : "Afficher corrections"}</button>
          <span class="tag">${examState.finished ? ("Note : " + examState.score + "/20") : "Réponses cachées jusqu’à la fin"}</span>
        </div>
      </div>

      <div class="card ${lang==="ar" ? "arPage" : ""}">
        ${examState.questions.map((q,i)=>{
          const name = `ex_${i}`;
          const chosen = examState.answers[i];
          const corr = examState.finished && examState.showCorrections;
          const good = examState.finished && (chosen===q.a);
          return `
            <div class="exerciseItem" data-exam-q="${i}">
              <div class="top">
                <div>
                  <b>${i+1}) ${q.q}</b>
                  <div class="muted">${q._k}</div>
                </div>
                <div class="tag">${chosen===null ? "—" : "✓"}</div>
              </div>
              <div style="margin-top:6px">
                ${q.opts.map((o,j)=>`
                  <label class="opt">
                    <input type="radio" name="${name}" value="${j}" ${chosen===j?"checked":""} ${examState.finished?"disabled":""}/>
                    <span>${o}</span>
                  </label>
                `).join("")}
              </div>
              <div class="muted" style="margin-top:6px">
                ${examState.finished ? (good ? "<span class='good'>✅ Correct</span>" : (chosen===null ? "<span class='warn'>⚠️ Non répondu</span>" : "<span class='bad'>❌ Faux</span>")) : "<span class='muted'>Réponse bloquée (examen)</span>"}
              </div>
              <div class="answer ${corr?"show":""}">
                ✅ Bonne réponse : <b>${q.opts[q.a]}</b><br/>
                ${q.exp ? ("💡 " + q.exp) : ""}
              </div>
            </div>
          `;
        }).join("")}
      </div>
    `;

    $("#jumpTop", area).addEventListener("click", ()=>window.scrollTo({top:0, behavior:"smooth"}));
    $("#finishBtn", area).addEventListener("click", ()=>{ if(!examState.finished) finish(false); });
    $("#toggleCorr", area).addEventListener("click", ()=>{ if(!examState.finished) return; examState.showCorrections = !examState.showCorrections; renderExam(); });

    const grid = $("#qGrid", area);
    examState.questions.forEach((_,i)=>{
      const chip = document.createElement("div");
      chip.className = "qChip";
      chip.textContent = (i+1);
      if(examState.answers[i]!==null) chip.classList.add("done");
      if(examState.finished){
        const chosen = examState.answers[i];
        if(chosen===examState.questions[i].a) chip.classList.add("good");
        else if(chosen!==null) chip.classList.add("bad");
      }
      chip.addEventListener("click", ()=>goto(i));
      grid.appendChild(chip);
    });

    $$('input[type="radio"]', area).forEach(r=>{
      r.addEventListener("change", ()=>{
        const i = parseInt(r.name.replace("ex_",""),10);
        examState.answers[i] = parseInt(r.value,10);
        renderExam();
      });
    });
  }

  $("#startExam", sec).addEventListener("click", start);
  $("#resetExam", sec).addEventListener("click", ()=>{ stopTimer(); examState=null; $("#examArea", sec).innerHTML=""; $("#examWarn", sec).textContent=""; });

  return sec;
}

function renderAllPages(){
  const wrap = $("#pages");
  wrap.innerHTML = "";
  wrap.appendChild(renderHome());
  wrap.appendChild(renderTracking());
  wrap.appendChild(renderExamPage());
  window.APP_DATA.subjects.forEach(s=>wrap.appendChild(renderSubjectPage(s.key)));
}

function showPage(key){
  $$("[data-page]").forEach(p=>p.style.display = (p.dataset.page===key ? "block" : "none"));
  $$(".navbtn").forEach(b=>b.classList.toggle("active", b.dataset.nav===key));
  window.scrollTo({top:0, behavior:"smooth"});
}

function setupExportImport(){
  $("#exportBtn").addEventListener("click", ()=>{
    const st = loadStore();
    const payload = {
      version: window.APP_DATA.meta.version,
      exportedAt: new Date().toISOString(),
      student: st.student||{},
      tracking: st.tracking||{},
      examHistory: st.examHistory||[],
    };
    const blob = new Blob([JSON.stringify(payload,null,2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "suivi_revision_3ap.json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });
  $("#importFile").addEventListener("change", async (e)=>{
    const f = e.target.files && e.target.files[0];
    if(!f) return;
    try{
      const txt = await f.text();
      const obj = JSON.parse(txt);
      const st = loadStore();
      st.student = obj.student || st.student;
      st.tracking = obj.tracking || st.tracking;
      st.examHistory = obj.examHistory || st.examHistory;
      saveStore(st);
      buildNav();
      renderAllPages();
      showPage("suivi");
      alert("Import terminé ✅");
    }catch(err){
      alert("Fichier invalide ❌");
    } finally {
      e.target.value = "";
    }
  });
}

initSettings();
renderAllPages();
buildNav();
setupExportImport();
showPage("accueil");
</script>
